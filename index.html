<!DOCTYPE html>
<html>
<head>
    <title>TREDT SMP MAP V7</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>
    <script type="text/javascript" src="lib/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify.min.css">
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>
    <script type="text/javascript" src="custom.markers.js"></script>
    <script type="text/javascript" src="unmined.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">

    <style>
        body { margin: 0; background: #10120d; overflow: hidden; font-family: 'Minecraftia', monospace; }
        @font-face { font-family: 'Minecraftia'; src: url('minecraftia.ttf'); }

        :root {
            --mc-grass: #5f9f32;
            --mc-dirt: #795139;
            --mc-stone: #6b6b6b;
            --mc-dark: #1b1b16;
            --mc-panel: #2f2a1f;
            --mc-panel-light: #4a3d2a;
            --mc-border: #17130d;
            --mc-gold: #f5c84b;
            --mc-paper: #d8c58b;
            --sprite-map: url("https://static.wikia.nocookie.net/minecraft_gamepedia/images/9/9f/Filled_Map_JE2_BE2.png/revision/latest?format=original");
            --sprite-compass: url("https://static.wikia.nocookie.net/minecraft_gamepedia/images/3/3e/Compass_JE3_BE3.gif/revision/latest?format=original");
            --sprite-chest: url("https://static.wikia.nocookie.net/minecraft_gamepedia/images/0/0e/Chest_%28S%29_JE2_BE2.png/revision/latest?format=original");
            --sprite-grass: url("https://static.wikia.nocookie.net/minecraft_gamepedia/images/2/23/Grass_Block_JE7_BE6.png/revision/latest?format=original");
        }

        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background:
                linear-gradient(180deg, #263a52 0%, #304d67 44%, #1d2d2d 44%, #152316 100%);
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff;
            isolation: isolate;
            transition: opacity 900ms ease, visibility 900ms ease;
        }
        .overlay-screen::before,
        .overlay-screen::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }
        .overlay-screen::before {
            background:
                linear-gradient(90deg, transparent 0 95%, rgba(255,255,255,.05) 95% 100%),
                linear-gradient(180deg, transparent 0 95%, rgba(0,0,0,.16) 95% 100%);
            background-size: 64px 64px;
            opacity: .65;
        }
        .overlay-screen::after {
            background:
                linear-gradient(180deg, transparent 0 70%, rgba(0,0,0,.34) 100%),
                radial-gradient(circle at 18% 26%, rgba(245,200,75,.2), transparent 22%),
                radial-gradient(circle at 84% 18%, rgba(255,255,255,.14), transparent 18%);
        }
        .overlay-screen.is-done {
            opacity: 0;
            visibility: hidden;
        }

        .fade {
            opacity: 0; transform: translateY(12px) scale(.98); transition: opacity 900ms ease, transform 900ms ease;
        }

        .show { opacity: 1; transform: translateY(0) scale(1); }

        .title-text {
            font-size: clamp(1.35rem, 4vw, 3rem); color: #f9f3d0;
            text-shadow: 4px 4px 0 #312615, 0 6px 0 #111;
            text-align: center;
            line-height: 1.45;
            letter-spacing: 0;
        }
        .intro-stage {
            position: relative;
            width: min(760px, calc(100vw - 32px));
            min-height: 310px;
            display: grid;
            place-items: center;
        }
        .intro-panel {
            position: relative;
            width: min(680px, 94vw);
            padding: 34px 28px 30px;
            background: linear-gradient(180deg, #4a3d2a, #2d2419);
            border: 4px solid #17130d;
            box-shadow: inset 0 0 0 4px rgba(255,255,255,.08), 0 16px 0 rgba(0,0,0,.35);
            text-align: center;
            animation: panelDrop 900ms cubic-bezier(.2,.8,.2,1) both;
        }
        .intro-panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(245,200,75,.38);
            pointer-events: none;
        }
        .intro-kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #20180c;
            background: var(--mc-gold);
            border: 3px solid #8f6521;
            padding: 8px 14px;
            margin-bottom: 18px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
            font-size: clamp(.72rem, 2vw, .95rem);
        }
        .intro-kicker::before {
            content: "";
            width: 28px;
            height: 28px;
            background:
                linear-gradient(180deg, #6dbb3f 0 34%, #795139 34% 100%);
            border: 2px solid #1b150d;
            box-shadow: inset 0 5px 0 rgba(255,255,255,.16), inset 0 -5px 0 rgba(0,0,0,.24);
            image-rendering: pixelated;
        }
        .intro-subtitle {
            margin-top: 18px;
            font-size: clamp(.9rem, 2.4vw, 1.25rem);
            color: #9be16a;
            text-shadow: 3px 3px 0 #15200e;
        }
        .copyright {
            position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
            width: min(900px, calc(100vw - 28px));
            font-size: clamp(.65rem, 2vw, .95rem); color: #eadca0;
            text-shadow: 3px 3px 0 #17130d;
            text-align: center;
        }
        .block-rain {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .intro-block {
            position: absolute;
            width: 42px;
            height: 42px;
            border: 3px solid rgba(0,0,0,.5);
            box-shadow: inset 0 8px 0 rgba(255,255,255,.12), inset 0 -8px 0 rgba(0,0,0,.22), 6px 6px 0 rgba(0,0,0,.22);
            animation: blockToward 4.2s ease-in-out infinite;
        }
        .intro-block.grass { background: linear-gradient(180deg, var(--mc-grass) 0 32%, var(--mc-dirt) 32% 100%); left: 7%; top: 18%; animation-delay: 0s; }
        .intro-block.stone { background: var(--mc-stone); left: 86%; top: 19%; animation-delay: .35s; }
        .intro-block.gold { background: #d3a72c; left: 16%; top: 72%; animation-delay: .7s; }
        .intro-block.log { background: #8a5a2f; left: 78%; top: 70%; animation-delay: 1.05s; }
        .intro-block.water { background: #2c75c9; left: 47%; top: 8%; animation-delay: 1.4s; }
        .ground-strip {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 24vh;
            min-height: 142px;
            background:
                linear-gradient(180deg, #5f9f32 0 18px, #795139 18px 100%);
            box-shadow: inset 0 8px 0 rgba(255,255,255,.12);
        }

        @keyframes blockToward {
            0% { transform: translate(0, 0) scale(.72) rotate(0deg); opacity: 0; }
            18% { opacity: 1; }
            58% { transform: translate(calc(50vw - 50%), 58px) scale(1.15) rotate(8deg); opacity: 1; }
            100% { transform: translate(calc(50vw - 50%), 94px) scale(.9) rotate(0deg); opacity: 0; }
        }
        @keyframes panelDrop {
            from { opacity: 0; transform: translateY(-22px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- SIDE MENU CSS --- */

        #hamburger {
            position: fixed;
            bottom: 18px;
            right: 18px;
            width: 58px;
            height: 58px;
            cursor: pointer;
            z-index: 10001;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #7fbd45, #4d7f2d);
            border: 4px solid #1d2a12;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,.13), 0 7px 0 rgba(0,0,0,.42);
            transition: transform .18s ease, filter .18s ease;
        }
        #hamburger div {
            grid-area: 1 / 1;
            width: 30px;
            height: 5px;
            background-color: #f8efd0;
            border: 1px solid #1d2a12;
            box-shadow: 0 10px 0 #f8efd0, 0 -10px 0 #f8efd0;
            transition: background-color 0.3s;
        }
        #hamburger div:nth-child(2),
        #hamburger div:nth-child(3) { display: none; }
        #hamburger:hover div {
            background-color: #fff9d8;
        }
        #hamburger:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        #sideMenu {
            height: 100%;
            width: min(380px, 92vw);
            position: fixed;
            top: 0; left: 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,.04), transparent 170px),
                #2f2a1f;
            overflow: hidden;
            transform: translateX(-105%);
            transition: transform .32s cubic-bezier(.2,.8,.2,1);
            padding: 0;
            z-index: 10000;
            color: #f5edd0;
            font-family: 'Minecraftia', monospace;
            border-right: 5px solid #17130d;
            box-shadow: 10px 0 0 rgba(0,0,0,.22), inset -4px 0 0 rgba(255,255,255,.07);
        }
        #sideMenu.open {
            transform: translateX(0);
        }
        .menu-header {
            display: grid;
            grid-template-columns: 46px 1fr 42px;
            gap: 12px;
            align-items: center;
            padding: 18px 16px 14px;
            background: linear-gradient(180deg, #4b6f32, #335021);
            border-bottom: 4px solid #17130d;
        }
        .menu-sprite {
            width: 42px;
            height: 42px;
            background:
                linear-gradient(90deg, transparent 0 8px, #956f35 8px 13px, transparent 13px 100%),
                linear-gradient(180deg, #d8c58b 0 100%);
            border: 3px solid #21140f;
            box-shadow: inset 0 0 0 4px #b89d59, 3px 3px 0 rgba(0,0,0,.35);
            image-rendering: pixelated;
            position: relative;
        }
        .menu-sprite::before,
        .menu-sprite::after {
            content: "";
            position: absolute;
            background: #628f46;
            border: 2px solid #3d5f2d;
        }
        .menu-sprite::before {
            width: 12px;
            height: 8px;
            left: 13px;
            top: 12px;
        }
        .menu-sprite::after {
            width: 9px;
            height: 11px;
            right: 10px;
            bottom: 10px;
        }
        .menu-title {
            font-size: 1rem;
            color: #fff6d6;
            text-shadow: 3px 3px 0 #17230e;
        }
        .menu-subtitle {
            display: block;
            margin-top: 5px;
            font-size: .62rem;
            color: #d6e8a8;
        }
        #closeMenu {
            width: 40px;
            height: 40px;
            cursor: pointer;
            color: #fff6d6;
            background: #7f3b2d;
            border: 3px solid #21140f;
            font: inherit;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,.22);
        }
        .menu-search {
            padding: 12px 14px;
            background: #211c14;
            border-bottom: 4px solid #17130d;
        }
        .menu-search input {
            width: 100%;
            box-sizing: border-box;
            color: #fff6d6;
            background: #15110c;
            border: 3px solid #4b3d28;
            outline: none;
            padding: 11px 12px;
            font: inherit;
            font-size: .75rem;
        }
        .menu-search input:focus {
            border-color: var(--mc-gold);
        }
        #sideMenu ul {
            list-style: none;
            padding: 12px;
            margin: 0;
            height: calc(100vh - 144px);
            overflow-y: auto;
            scrollbar-color: #8f6521 #1a150f;
        }
        #sideMenu ul li {
            display: grid;
            grid-template-columns: 34px 1fr;
            gap: 10px;
            align-items: center;
            padding: 11px 10px;
            margin-bottom: 8px;
            background: #3b3324;
            border: 3px solid #17130d;
            cursor: pointer;
            font-size: .74rem;
            user-select: none;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
            transition: transform .16s ease, background .16s ease, border-color .16s ease;
        }
        #sideMenu ul li:hover {
            background-color: #51442c;
            border-color: #8f6521;
            transform: translateX(3px);
        }
        .location-icon {
            width: 30px;
            height: 30px;
            background:
                linear-gradient(45deg, transparent 0 42%, #e23422 42% 58%, transparent 58% 100%),
                radial-gradient(circle, #2b2b2b 0 46%, #9b9b92 47% 63%, #251b10 64% 76%, transparent 77%);
            image-rendering: pixelated;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,.35));
        }
        .location-name {
            display: block;
            line-height: 1.35;
            color: #fff6d6;
        }
        .location-coords {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 6px;
            color: #1b150d;
            background: var(--mc-paper);
            border: 2px solid #8f6521;
            font-size: .58rem;
        }

        #menuOverlay {
            position: fixed;
            display: none;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 10, 6, 0.45);
            z-index: 9999;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        @media (max-width: 560px) {
            .intro-panel { padding: 26px 18px 24px; }
            .intro-block { width: 32px; height: 32px; }
            #hamburger { width: 52px; height: 52px; }
        }
    </style>
</head>
<body>
    <div id="overlay" class="overlay-screen">
        <div class="ground-strip"></div>
        <div class="block-rain" aria-hidden="true">
            <span class="intro-block grass"></span>
            <span class="intro-block stone"></span>
            <span class="intro-block gold"></span>
            <span class="intro-block log"></span>
            <span class="intro-block water"></span>
        </div>
        <div class="intro-stage">
            <div id="loading-text" class="intro-kicker fade">Generating chunks...</div>
            <div id="welcome-text" class="intro-panel fade" style="display:none">
                <div class="title-text">Welcome to the TREDT SMP Map<br>Version 7.0</div>
                <div class="intro-subtitle">Now with 3D Effects</div>
            </div>
        </div>
        <div class="copyright">©TREDT Publications Studios 2026 - 2027</div>
    </div>

    <div id="map" style="display:none"></div>

    <!-- Hamburger icon bottom-right -->
    <div id="hamburger" title="Open Locations Menu">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <!-- Side menu -->
    <div id="sideMenu">
        <div class="menu-header">
            <div class="menu-sprite" aria-hidden="true"></div>
            <div>
                <div class="menu-title">TREDT Locations</div>
                <span class="menu-subtitle">SMP Map Index</span>
            </div>
            <button id="closeMenu" type="button" title="Close Locations Menu">X</button>
        </div>
        <div class="menu-search">
            <input id="locationSearch" type="search" placeholder="Search locations..." autocomplete="off">
        </div>
        <ul id="locationList">
            <!-- populated by JS -->
        </ul>
    </div>

    <!-- Overlay for menu -->
    <div id="menuOverlay"></div>

    <script>
        const overlay = document.getElementById('overlay');
        const loadingText = document.getElementById('loading-text');
        const welcomeText = document.getElementById('welcome-text');
        const hamburger = document.getElementById('hamburger');
        const sideMenu = document.getElementById('sideMenu');
        const closeMenuButton = document.getElementById('closeMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const locationList = document.getElementById('locationList');
        const locationSearch = document.getElementById('locationSearch');

        const locations = [
            { name: "Spawn Valley", x: 21, z: -10 },
            { name: "Highest Point of Spawn Valley", x: 168, z: 29 },

            { name: "Cemetery for the Fallen", x: -1818, z: 103 },
            { name: "RESITRICTED AREA", x: 1759, z: 4428 }
        ];

        // Populate menu with location names and map coordinates.
        locations.forEach(loc => {
            const li = document.createElement('li');
            li.dataset.name = loc.name.toLowerCase();
            li.innerHTML = `
                <span class="location-icon" aria-hidden="true"></span>
                <span>
                    <span class="location-name">${loc.name}</span>
                    <span class="location-coords">X ${loc.x} / Z ${loc.z}</span>
                </span>
            `;
            locationList.appendChild(li);
        });

        function openMenu() {
            sideMenu.classList.add('open');
            menuOverlay.style.display = "block";
            locationSearch.focus();
        }
        function closeMenu() {
            sideMenu.classList.remove('open');
            menuOverlay.style.display = "none";
        }

        hamburger.addEventListener('click', openMenu);
        closeMenuButton.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
        locationSearch.addEventListener('input', () => {
            const query = locationSearch.value.trim().toLowerCase();
            [...locationList.children].forEach(item => {
                item.style.display = item.dataset.name.includes(query) ? 'grid' : 'none';
            });
        });

        // Existing overlay / loading logic below:

        // Step 1: Show loading text.
        setTimeout(() => loadingText.classList.add('show'), 100);
        setTimeout(() => loadingText.classList.remove('show'), 1900);

        // Step 2: Show welcome text.
        setTimeout(() => {
            loadingText.style.display = 'none';
            welcomeText.style.display = 'block';
            setTimeout(() => welcomeText.classList.add('show'), 100);
        }, 2500);
        setTimeout(() => welcomeText.classList.remove('show'), 6700);

        // Step 3: Load map after welcome.
        setTimeout(() => {
            overlay.classList.add('is-done');
            document.getElementById('map').style.display = 'block';
            initMap();
        }, 7700);
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 8700);

        function initMap() {
            document.title = UnminedMapProperties.worldName + " - TREDT SMP";
            if (UnminedCustomMarkers?.isEnabled && UnminedCustomMarkers.markers) {
                UnminedMapProperties.markers = [...(UnminedMapProperties.markers || []), ...UnminedCustomMarkers.markers];
            }
            if (UnminedPlayers?.length > 0) {
                UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
            }
            const unmined = new Unmined(document.getElementById('map'), UnminedMapProperties, UnminedRegions);
        }
    </script>
</body>
