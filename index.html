<!DOCTYPE html>
<html>
<head>
    <title>uNmINeD</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>
    <script type="text/javascript" src="lib/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify.min.css">
    <script type="text/javascript" src="unmined.map.properties.js"></script>

    <script type="text/javascript" src="unmined.map.players.js"></script>

    <link rel="stylesheet" type="text/css" href="index.css">

    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: 'Minecraftia', monospace; }
        @font-face { font-family: 'Minecraftia'; src: url('minecraftia.ttf'); }

        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .fade {
            opacity: 0; transition: opacity 2s ease-in-out;
        }

        .show { opacity: 1; }

        .title-text {
            font-size: 2rem; color: #0ff; text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            text-align: center;
        }

        .copyright {
            position: absolute; bottom: 20px; font-size: 1rem; color: #0ff; text-shadow: 0 0 5px #0ff;
        }

        /* --- SIDE MENU CSS --- */

        /* Hamburger icon moved to bottom-right */
        #hamburger {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 30px;
            height: 25px;
            cursor: pointer;
            z-index: 10001; /* above everything */
        }
        #hamburger div {
            background-color: #0ff;
            height: 4px;
            margin: 5px 0;
            border-radius: 2px;
            transition: background-color 0.3s;
        }
        #hamburger:hover div {
            background-color: #66ffff;
        }

        /* Side menu panel */
        #sideMenu {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0; left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            z-index: 10000;
            color: #0ff;
            font-family: 'Minecraftia', monospace;
            box-shadow: 2px 0 10px #0ff99;
        }
        #sideMenu ul {
            list-style: none;
            padding: 0 15px;
            margin: 0;
        }
        #sideMenu ul li {
            padding: 12px 10px;
            border-bottom: 1px solid #0a0a0a;
            cursor: pointer;
            font-size: 1rem;
            user-select: none;
        }
        #sideMenu ul li:hover {
            background-color: #005577;
        }

        /* Overlay when menu is open */
        #menuOverlay {
            position: fixed;
            display: none;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,255,255,0.1);
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="overlay" class="overlay-screen">
        <div id="loading-text" class="title-text fade">Loading TREDT SMP Map...</div>
        <div id="welcome-text" class="title-text fade" style="display:none">
            Welcome to TREDT SMP Map<br>2D with 3D Effects and Shadows
        </div>
        <div class="copyright">©TREDT Publications Society(Regd.) 2025 - 2026</div>
    </div>

    <div id="map" style="display:none"></div>

    <!-- Hamburger icon bottom-right -->
    <div id="hamburger" title="Open Locations Menu">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <!-- Side menu -->
    <div id="sideMenu">

            <!-- populated by JS -->
        </ul>
    </div>

    <!-- Overlay for menu -->

        // Populate menu with only names (no coords)
        locations.forEach(loc => {
            const li = document.createElement('li');
            li.textContent = loc.name;
            locationList.appendChild(li);
        });

        function openMenu() {
            sideMenu.style.width = "300px";
            menuOverlay.style.display = "block";
        }
        function closeMenu() {
            sideMenu.style.width = "0";
            menuOverlay.style.display = "none";
        }

        hamburger.addEventListener('click', openMenu);
        menuOverlay.addEventListener('click', closeMenu);

        // Existing overlay / loading logic below:

        // Step 1: Show loading text (fade in 2.5s, fade out 2.5s)
        setTimeout(() => loadingText.classList.add('show'), 100);
        setTimeout(() => loadingText.classList.remove('show'), 2600);

        // Step 2: Show welcome text (fade in 2s, fade out 2s)
        setTimeout(() => {
            loadingText.style.display = 'none';
            welcomeText.style.display = 'block';
            setTimeout(() => welcomeText.classList.add('show'), 100);
        }, 5100);
        setTimeout(() => welcomeText.classList.remove('show'), 7100);

        // Step 3: Load map after welcome
        setTimeout(() => {
            overlay.style.display = 'none';
            document.getElementById('map').style.display = 'block';
            initMap();
        }, 9200);

        function initMap() {
            document.title = UnminedMapProperties.worldName + " - TREDT SMP";
            if (UnminedCustomMarkers?.isEnabled && UnminedCustomMarkers.markers) {
                UnminedMapProperties.markers = [...(UnminedMapProperties.markers || []), ...UnminedCustomMarkers.markers];
            }
            if (UnminedPlayers?.length > 0) {
                UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
            }
            const unmined = new Unmined(document.getElementById('map'), UnminedMapProperties, UnminedRegions);
        }
    </script>
</body>
</html>
