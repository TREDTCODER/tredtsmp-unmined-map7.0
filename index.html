<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TREDT SMP 1 - Shutdown</title>
    <style>
        body { 
            margin: 0; 
            background: #10120d; 
            overflow: hidden; 
            font-family: 'Minecraftia', monospace; 
        }
        @font-face { 
            font-family: 'Minecraftia'; 
            src: url('minecraftia.ttf'); 
        }

        :root {
            --mc-grass: #5f9f32;
            --mc-dirt: #795139;
            --mc-stone: #6b6b6b;
            --mc-gold: #f5c84b;
        }

        .overlay-screen {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(180deg, #263a52 0%, #304d67 44%, #1d2d2d 44%, #152316 100%);
            z-index: 9999;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            color: #fff;
            isolation: isolate;
        }

        .overlay-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                linear-gradient(90deg, transparent 0 95%, rgba(255,255,255,.05) 95% 100%),
                linear-gradient(180deg, transparent 0 95%, rgba(0,0,0,.16) 95% 100%);
            background-size: 64px 64px;
            opacity: .65;
        }

        .intro-panel {
            position: relative;
            width: min(640px, 90vw);
            padding: 34px 28px 30px;
            background: linear-gradient(180deg, #4a3d2a, #2d2419);
            border: 4px solid #17130d;
            box-shadow: inset 0 0 0 4px rgba(255,255,255,.08), 0 16px 0 rgba(0,0,0,.35);
            text-align: center;
            z-index: 10;
        }

        .intro-panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(245,200,75,.38);
            pointer-events: none;
        }

        .title-text {
            font-size: clamp(1.2rem, 3.5vw, 2.2rem); 
            color: #ff5555;
            text-shadow: 4px 4px 0 #311515, 0 6px 0 #111;
            text-align: center;
            line-height: 1.35;
            margin-bottom: 12px;
        }

        .intro-subtitle {
            font-size: clamp(.85rem, 2.2vw, 1.25rem);
            color: #9be16a;
            text-shadow: 3px 3px 0 #15200e;
            margin-bottom: 24px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            margin-top: 10px;
        }

        .mc-button {
            display: inline-block;
            width: min(320px, 100%);
            padding: 12px 20px;
            background: #707070;
            border: 3px solid #17130d;
            color: #ffffff;
            text-shadow: 2px 2px 0 #000;
            text-decoration: none;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            box-shadow: inset -3px -3px 0 #3c3c3c, inset 3px 3px 0 #a0a0a0;
            box-sizing: border-box;
            transition: background 0.15s;
        }

        .mc-button:hover {
            background: #8b8b8b;
            color: #fff9d8;
        }

        .mc-button:active {
            box-shadow: inset 3px 3px 0 #3c3c3c, inset -3px -3px 0 #a0a0a0;
        }

        .footer {
            position: absolute; 
            bottom: 22px; 
            left: 50%; 
            transform: translateX(-50%);
            width: min(900px, calc(100vw - 28px));
            font-size: clamp(.65rem, 1.8vw, .85rem); 
            color: #eadca0;
            text-shadow: 3px 3px 0 #17130d;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }

        .powered-by {
            color: #aaaaaa;
        }

        .block-rain {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .intro-block {
            position: absolute;
            width: 42px;
            height: 42px;
            border: 3px solid rgba(0,0,0,.5);
            box-shadow: inset 0 8px 0 rgba(255,255,255,.12), inset 0 -8px 0 rgba(0,0,0,.22), 6px 6px 0 rgba(0,0,0,.22);
            animation: blockToward 4.2s ease-in-out infinite;
        }

        .intro-block.grass { background: linear-gradient(180deg, var(--mc-grass) 0 32%, var(--mc-dirt) 32% 100%); left: 7%; top: 18%; animation-delay: 0s; }
        .intro-block.stone { background: var(--mc-stone); left: 86%; top: 19%; animation-delay: .35s; }
        .intro-block.gold { background: #d3a72c; left: 16%; top: 72%; animation-delay: .7s; }
        .intro-block.log { background: #8a5a2f; left: 78%; top: 70%; animation-delay: 1.05s; }
        .intro-block.water { background: #2c75c9; left: 47%; top: 8%; animation-delay: 1.4s; }

        .ground-strip {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 24vh;
            min-height: 142px;
            background: linear-gradient(180deg, #5f9f32 0 18px, #795139 18px 100%);
            box-shadow: inset 0 8px 0 rgba(255,255,255,.12);
        }

        @keyframes blockToward {
            0% { transform: translate(0, 0) scale(.72) rotate(0deg); opacity: 0; }
            18% { opacity: 1; }
            58% { transform: translate(calc(50vw - 50%), 58px) scale(1.15) rotate(8deg); opacity: 1; }
            100% { transform: translate(calc(50vw - 50%), 94px) scale(.9) rotate(0deg); opacity: 0; }
        }

        @media (max-width: 560px) {
            .intro-panel { padding: 26px 18px 24px; }
            .intro-block { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>
    <div class="overlay-screen">
        <div class="ground-strip"></div>
        <div class="block-rain" aria-hidden="true">
            <span class="intro-block grass"></span>
            <span class="intro-block stone"></span>
            <span class="intro-block gold"></span>
            <span class="intro-block log"></span>
            <span class="intro-block water"></span>
        </div>

        <div class="intro-panel">
            <div class="title-text">TREDT SMP 1 HAS BEEN SHUTDOWN!</div>
            <div class="intro-subtitle">THANKS FOR PLAYING WITH US</div>

            <div class="button-group">
                <a class="mc-button" href="https://iifsgfipnximqzuhsjvj.supabase.co/storage/v1/object/public/tredt-files/public/Presidential%20Executive%20Order%20I%20Das%20Admisnitration_signed.pdf" target="_blank" rel="noopener noreferrer">
                    SHUTDOWN NOTICE
                </a>
                <a class="mc-button" href="https://tredtsmp1-archive.netlify.app/">
                    ARCHIVE
                </a>
            </div>
        </div>

        <div class="footer">
            <div class="powered-by">POWERED BY Aternos GmbH</div>
            <div>©TREDT PUBLICATIONS STUDIOS. ALL RIGHTS RESERVED</div>
        </div>
    </div>
</body>
</html>
